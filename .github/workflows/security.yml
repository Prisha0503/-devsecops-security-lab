name: Security Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            zricethezav/gitleaks:latest \
            detect --source /repo \
            --config /repo/.gitleaks.toml \
            --exit-code 1

  sast-scan:
    name: SAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep scan --config auto

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Python dependency metadata
        run: |
          python3 -c 'import json; packages = {line.split("==")[0].strip().lower(): {"version": "==" + line.split("==")[1].strip()} for line in open("requirements.txt") if "==" in line}; json.dump({"_meta": {"hash": {"sha256": "lab-only"}, "pipfile-spec": 6, "requires": {"python_version": "3.11"}, "sources": []}, "default": packages, "develop": {}}, open("Pipfile.lock", "w"), indent=2)'

      - name: Run Trivy
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            aquasec/trivy:latest \
            fs --scanners vuln --exit-code 0 /repo
