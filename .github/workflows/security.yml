name: Security Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect --source /repo \
            --config /repo/.gitleaks.toml \
            --exit-code 1

    sast-scan:
    name: SAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep scan --config auto

     dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Python dependency metadata
        run: |
          mkdir -p dependency-scan
          python3 - <<'PY'
          import json

          packages = []
          with open("requirements.txt") as f:
              for line in f:
                  line = line.strip()
                  if "==" in line and not line.startswith("#"):
                      name, version = line.split("==", 1)
                      packages.append({
                          "name": name.strip(),
                          "version": version.strip()
                      })

          with open("dependency-scan/Pipfile.lock", "w") as f:
              json.dump({
                  "_meta": {
                      "hash": {"sha256": "lab-only"},
                      "pipfile-spec": 6,
                      "requires": {"python_version": "3.11"},
                      "sources": []
                  },
                  "default": {
                      p["name"].lower(): {
                          "version": "==" + p["version"]
                      }
                      for p in packages
                  },
                  "develop": {}
              }, f, indent=2)
          PY

      - name: Run Trivy
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            aquasec/trivy:latest \
            fs --scanners vuln --exit-code 0 /repo/dependency-scan
